<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>winter letter</title>
    <!-- FIXED PATH -->
    <link rel="stylesheet" href="/vn/styles.css">
</head>
<body>

    <!-- TITLE SCREEN -->
    <div id="title-screen">
        <div class="top-menu">
            <a onclick="startGame()">start</a>
            <a onclick="alert('a quiet winter story by coy')">about</a>
            <a onclick="alert('click or press Space / enter to advance')">help</a>
            <a onclick="window.location.href='/'">quit</a>
        </div>

        <!-- TITLE IMAGE (replace this file with your actual title art) -->
        <div id="title-art">
            <img src="/vn/images/title.png" alt="WINTER LETTER">
        </div>

        <div class="footer">winter_letter</div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="background"></div>
        <div id="overlay"></div>

        <img id="character" src="" alt="" style="position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%); max-height: 68%; z-index: 5; opacity: 0; transition: opacity 0.8s ease;">

        <div id="textbox">
            <div id="namebox"></div>
            <div id="text"></div>
        </div>

        <div id="letter-box" style="display: none;">
            <div id="letter-paper">
                <div id="letter-text"></div>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop></audio>
    <audio id="sfx"></audio>

    <!-- FIXED PATH -->
    <script src="/vn/script.js"></script>
</body>
</html>
